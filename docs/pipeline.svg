<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#475569"/>
    </marker>
    <style>
      .layer-label { font-weight: 600; fill: #1e293b; font-size: 12px; }
      .node text { dominant-baseline: middle; text-anchor: middle; }
      .l0 { fill: #e0f2ff; stroke: #1f6feb; }
      .l1 { fill: #dcfce7; stroke: #1a7f37; }
      .l2 { fill: #fef3c7; stroke: #a16207; }
      .l3 { fill: #fee2e2; stroke: #b91c1c; }
      .l35 { fill: #f3e8ff; stroke: #7c3aed; }
      .l4 { fill: #e2e8f0; stroke: #475569; }
      .edge { stroke: #475569; stroke-width: 1.4; fill: none; }
      .edge-conditional { stroke-dasharray: 5 4; }
      .branch-label { font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <text class="layer-label" x="20" y="38">Layer 0 — Bootstrap</text>
  <g class="node">
    <rect class="l0" x="380" y="20" width="220" height="46" rx="8"/>
    <text x="490" y="44">Ingestion</text>
  </g>
  <g class="node">
    <rect class="l0" x="380" y="92" width="220" height="46" rx="8"/>
    <text x="490" y="116">Profiler + hallucination guard</text>
  </g>

  <text class="layer-label" x="20" y="178">Layer 1 — Detection (parallel fan-out)</text>
  <g class="node">
    <rect class="l1" x="20" y="200" width="140" height="44" rx="8"/>
    <text x="90" y="222">Schema</text>
  </g>
  <g class="node">
    <rect class="l1" x="180" y="200" width="140" height="44" rx="8"/>
    <text x="250" y="222">Completeness</text>
  </g>
  <g class="node">
    <rect class="l1" x="340" y="200" width="140" height="44" rx="8"/>
    <text x="410" y="222">Duplicate</text>
  </g>
  <g class="node">
    <rect class="l1" x="500" y="200" width="140" height="44" rx="8"/>
    <text x="570" y="222">Anomaly</text>
  </g>
  <g class="node">
    <rect class="l1" x="660" y="200" width="140" height="44" rx="8"/>
    <text x="730" y="222">Consistency</text>
  </g>
  <g class="node">
    <rect class="l1" x="820" y="200" width="140" height="44" rx="8"/>
    <text x="890" y="222">Constraint</text>
  </g>

  <text class="layer-label" x="20" y="298">Layer 2 — Synthesis</text>
  <g class="node">
    <rect class="l2" x="280" y="320" width="420" height="50" rx="8"/>
    <text x="490" y="338">Synthesis supervisor</text>
    <text x="490" y="356" font-size="11" fill="#5a3a02">deliberation subgraph (outlier vs domain-negative)</text>
  </g>

  <text class="layer-label" x="20" y="408">Layer 3 — Remediation</text>
  <g class="node">
    <rect class="l3" x="280" y="430" width="420" height="46" rx="8"/>
    <text x="490" y="454">Remediation strategy registry</text>
  </g>

  <text class="layer-label" x="20" y="514">Layer 3.5 — Code Validator (conditional)</text>
  <g class="node">
    <rect class="l35" x="600" y="540" width="320" height="56" rx="8"/>
    <text x="760" y="558">Code Validator</text>
    <text x="760" y="578" font-size="11" fill="#3b1980">LLM fix loop in Docker / subprocess sandbox</text>
  </g>

  <text class="layer-label" x="20" y="624">Layer 4 — Reporting</text>
  <g class="node">
    <rect class="l4" x="280" y="650" width="420" height="50" rx="8"/>
    <text x="490" y="668">Report agent</text>
    <text x="490" y="686" font-size="11" fill="#1e293b">visualisations + JSON export</text>
  </g>

  <path class="edge" d="M490,66 L490,92" marker-end="url(#arrow)"/>

  <path class="edge" d="M490,138 C400,160 220,180 90,200" marker-end="url(#arrow)"/>
  <path class="edge" d="M490,138 C430,160 290,180 250,200" marker-end="url(#arrow)"/>
  <path class="edge" d="M490,138 C470,160 420,180 410,200" marker-end="url(#arrow)"/>
  <path class="edge" d="M490,138 C510,160 560,180 570,200" marker-end="url(#arrow)"/>
  <path class="edge" d="M490,138 C550,160 700,180 730,200" marker-end="url(#arrow)"/>
  <path class="edge" d="M490,138 C580,160 800,180 890,200" marker-end="url(#arrow)"/>

  <path class="edge" d="M90,244 C150,280 320,310 380,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M250,244 C290,280 380,310 420,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M410,244 C430,280 460,310 470,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M570,244 C540,280 510,310 510,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M730,244 C660,280 580,310 560,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M890,244 C800,280 660,310 600,320" marker-end="url(#arrow)"/>

  <path class="edge" d="M490,370 L490,430" marker-end="url(#arrow)"/>

  <path class="edge edge-conditional" d="M580,476 C620,500 700,520 760,540" marker-end="url(#arrow)"/>
  <text class="branch-label" x="635" y="502">gap_issues non-empty</text>

  <path class="edge" d="M400,476 C380,540 380,610 400,650" marker-end="url(#arrow)"/>
  <text class="branch-label" x="276" y="568">gap_issues empty</text>

  <path class="edge" d="M760,596 C760,630 640,650 600,650" marker-end="url(#arrow)"/>
</svg>
