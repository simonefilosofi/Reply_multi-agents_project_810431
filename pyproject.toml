[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noipa-data-quality-agents"
version = "0.1.0"
description = "Multi-agent data-quality pipeline for NoiPA (Italian Public Administration payroll) datasets."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [
    { name = "Mattia Cervelli", email = "mattia.cervelli01@gmail.com" },
]
keywords = ["data-quality", "multi-agent", "langgraph", "pydantic-ai", "noipa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pydantic-ai>=1.85,<2.0",
    "langgraph>=0.2,<1.0",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "anthropic>=0.40",
    "openai>=1.40",
    "tenacity>=8.2",
    "pandera>=0.29",
    "streamlit>=1.34",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "kaleido",
    "docker>=7.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/MattiaCervelli/Reply_multi-agents_project_810431"

[tool.setuptools.packages.find]
where = ["."]
include = ["state_demo*", "agents_demo*"]
exclude = ["tests*", "docs*", "data*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "build",
    "dist",
    ".venv",
    "venv",
    "images",
    "generated_fixes",
    "Datasets-Reply-20260313",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "B011", "S101"]
"scripts/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "images/",
    "generated_fixes/",
    "Datasets-Reply-20260313/",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["state_demo.config", "state_demo.issues", "state_demo.agent_names", "state_demo.locale_it", "state_demo.deliberation"]
strict = true

[tool.pytest.ini_options]
minversion = "8.1"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: tests that require a running Docker daemon",
    "integration: end-to-end pipeline integration tests",
    "slow: tests that take noticeable time to run",
]

[tool.coverage.run]
source = ["state_demo", "agents_demo", "tools.py", "tools_code_validator.py"]
branch = true
omit = ["tests/*", "scripts/*", "data/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
