repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
        args: ["--config-file", "pyproject.toml"]
        exclude: "^(tests/|scripts/|images/|generated_fixes/|Datasets-Reply-20260313/)"
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (quick)
        entry: pytest -q -x --no-cov -m "not slow and not docker and not integration"
        language: system
        pass_filenames: false
        stages: [pre-push]
