name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tests, graders and the notebook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Test suite
        run: pytest tests/ -q

      - name: Acceptance check over the recorded runs
        run: python tests/acceptance/acceptance.py

      - name: Regression check against the pinned invariants
        run: python tests/acceptance/verify.py

      - name: Execute the notebook against the recorded runs
        run: |
          pip install nbconvert ipykernel
          python -m ipykernel install --user --name python3 --display-name python3
          python -m jupyter nbconvert --to notebook --execute --output /tmp/executed.ipynb notebooks/main.ipynb

  live-run:
    name: End-to-end run against the real providers
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Report when no credentials are configured
        if: env.DEEPSEEK_API_KEY == ''
        run: |
          echo "No DEEPSEEK_API_KEY secret is set, so the live path cannot run."
          echo "Add DEEPSEEK_API_KEY, OPENAI_API_KEY and E2B_API_KEY as repository secrets."
          echo "The deterministic half of the pipeline is already covered by the checks job."

      - name: Confirm a browser is available for the PDF rendering
        if: env.DEEPSEEK_API_KEY != ''
        run: google-chrome --version || echo "no browser found; the report will ship without its PDF"

      - name: Record spesa.csv end to end
        if: env.DEEPSEEK_API_KEY != ''
        run: python scripts/record_run.py data/raw/project_data_quality/spesa.csv reports/runs/spesa

      - name: Grade the run this job just produced
        if: env.DEEPSEEK_API_KEY != ''
        run: python tests/acceptance/acceptance.py

      - name: Upload the delivered report and dataset
        if: env.DEEPSEEK_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: spesa-live-run
          path: |
            reports/runs/spesa/spesa.md
            reports/runs/spesa/spesa.html
            reports/runs/spesa/spesa.pdf
            reports/runs/spesa/spesa.json
            reports/runs/spesa/spesa.cleaned.csv
            reports/runs/spesa/spesa.changes.csv
            reports/runs/spesa/timings.json
